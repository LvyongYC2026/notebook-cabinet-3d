<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="中技安全科技有限公司-笔记本智能管理存储柜">
  <title>中技安全科技有限公司-笔记本智能管理存储柜</title>
  <link rel="stylesheet" href="styles.css?v=20261109-front-variants-v2">
  <link rel="stylesheet" href="panel-hud.css?v=20261109-front-variants-v2">
  <link rel="stylesheet" href="wiring.css?v=20261109-front-variants-v2">
  <link rel="stylesheet" href="room.css?v=20261109-front-variants-v2">
  <link rel="stylesheet" href="front-variants.css?v=20261109-front-variants-v2">
  <script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
</head>
<body>
  <main id="stage">
    <header class="product-header"><h1>中技安全科技有限公司-笔记本智能管理存储柜</h1></header>
    <nav class="scene-tabs" role="tablist" aria-label="展示视图">
      <button id="viewRoom" class="scene-tab" role="tab" data-scene-mode="room" aria-selected="false" disabled>机要室</button>
      <button id="viewCabinet" class="scene-tab active" role="tab" data-scene-mode="cabinet" aria-selected="true" disabled>整柜</button>
      <button id="viewSingle" class="scene-tab" role="tab" data-scene-mode="single" aria-selected="false" disabled>单仓</button>
    </nav>
    <nav id="singleTypes" class="single-types" aria-label="单仓机构类型" hidden>
      <button data-single-type="door" aria-pressed="false" title="左侧开门笔记本仓">开门仓</button>
      <button data-single-type="drawer" aria-pressed="true" title="右侧闭盖笔记本抽屉仓">抽屉仓</button>
    </nav>
    <nav id="roomControls" class="room-controls" aria-label="机要室视角与布局" hidden>
      <button id="roomOverview" aria-pressed="true" title="机要室整体概览">概览</button>
      <button id="roomInterior" aria-pressed="false" title="从室内查看智能柜">室内</button>
      <button id="roomTop" aria-pressed="false" title="俯视机要室布局">俯视</button>
      <button id="roomCutaway" aria-pressed="true" title="剖切前墙、右墙和屋顶">剖切</button>
      <button id="roomInfo" title="查看机要室布局参数（cm）">布局</button>
    </nav>
    <div id="viewer" aria-label="智能柜三维展示，可旋转、缩放并点击柜门和内部部件" tabindex="0"><div id="dimensionLabels" class="dimension-labels" aria-hidden="true" hidden></div></div>
    <p id="dimensionNote" class="dimension-note" hidden></p>
    <div id="loading" role="status" aria-label="正在加载三维机柜"><div class="loading-ring"></div></div>
    <button id="loadError" class="load-error icon-button" title="模型未能载入，点击重新加载" aria-label="模型未能载入，点击重新加载" hidden><svg viewBox="0 0 24 24"><path d="M4 9a8 8 0 1 1 0 7M4 4v5h5"/></svg></button>
    <aside id="componentPanel" class="component-panel" role="dialog" aria-labelledby="componentTitle" hidden>
      <div class="panel-heading"><span id="componentBasis" class="basis-tag"></span><button id="panelClose" class="panel-icon" aria-label="关闭参数浮窗" title="关闭参数浮窗"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
      <h2 id="componentTitle"></h2>
      <dl id="componentDimensions" class="component-dimensions"></dl>
      <div id="componentFacts" class="component-facts"></div>
      <p id="componentNotes" class="component-notes" hidden></p>
      <div class="panel-actions">
        <button id="focusComponent" class="panel-icon" aria-label="聚焦此部件" title="聚焦此部件"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/><circle cx="12" cy="12" r="3"/></svg></button>
        <button id="toggleComponentDoor" class="panel-icon" aria-label="打开关联柜门" title="打开关联柜门" hidden><svg viewBox="0 0 24 24"><path d="M4 21V3h12v18M4 3l10 3v15L4 18zM18 7l3 3-3 3m-2-3h5"/><path d="M11 11v2"/></svg></button>
        <button id="toggleComponentTray" class="panel-icon" aria-label="抽出托盘" title="抽出托盘" hidden><svg viewBox="0 0 24 24"><path d="M4 5h16v8H4zM4 13l-2 6h20l-2-6M12 5V1m-3 3 3-3 3 3"/></svg></button>
        <button id="inspectSingle" class="panel-icon" aria-label="查看单仓精细结构" title="查看单仓精细结构" hidden><svg viewBox="0 0 24 24"><path d="M3 3h11v11H3zM6 6h5v5H6zM13 17h8m-3-3 3 3-3 3M17 3v7"/></svg></button>
        <button id="focusSinglePorts" class="panel-icon" aria-label="聚焦单仓接口" title="聚焦单仓接口" hidden><svg viewBox="0 0 24 24"><path d="M5 5h14v11h-4v3H9v-3H5zM8 5v5m3-5v5m3-5v5m3-5v5"/></svg></button>
        <button id="focusSingleTray" class="panel-icon" aria-label="聚焦单仓托盘" title="聚焦单仓托盘" hidden><svg viewBox="0 0 24 24"><path d="M4 6h16v7H4zM4 13l-2 6h20l-2-6M8 3H3v5m13-5h5v5"/></svg></button>
      </div>
    </aside>
    <section id="wiringPanel" class="wiring-panel" role="dialog" aria-labelledby="wiringTitle" hidden></section>
    <section id="frontVariantMenu" class="front-variant-menu" aria-label="抽屉前板方案" hidden>
      <p>抽屉前板方案</p>
      <div class="front-variant-options" role="group" aria-label="选择抽屉前板">
        <button id="frontVariantGlass" aria-pressed="true">透明玻璃</button>
        <button id="frontVariantMetal" aria-pressed="false">金属前板</button>
      </div>
    </section>
    <nav class="toolbar" aria-label="三维展示控制">
      <button id="zoomIn" class="icon-button" aria-label="放大" title="放大" disabled><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5M7.5 10.5h6m-3-3v6"/></svg></button>
      <button id="zoomOut" class="icon-button" aria-label="缩小" title="缩小" disabled><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5M7.5 10.5h6"/></svg></button>
      <button id="rotateLeft" class="icon-button" aria-label="向左旋转" title="向左旋转" disabled><svg viewBox="0 0 24 24"><path d="M5 8a8 8 0 1 1-1 8M5 3v5h5M9 12l3-2 3 2v5l-3 2-3-2z"/></svg></button>
      <button id="rotateRight" class="icon-button" aria-label="向右旋转" title="向右旋转" disabled><svg viewBox="0 0 24 24"><path d="M19 8a8 8 0 1 0 1 8M19 3v5h-5M9 12l3-2 3 2v5l-3 2-3-2z"/></svg></button>
      <button id="autoRotate" class="icon-button" aria-label="自动旋转" title="自动旋转" aria-pressed="false" disabled><svg viewBox="0 0 24 24"><path d="M5 7a8 8 0 1 1-1 9M5 3v4h4M10 8l6 4-6 4z"/></svg></button>
      <button id="resetView" class="icon-button" aria-label="复位机柜与视角" title="复位机柜与视角" disabled><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8M5 10v11h14V10M9 21v-7h6v7"/></svg></button>
      <button id="frontView" class="icon-button" aria-label="正面视图" title="正面视图" disabled><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="1"/><path d="M10 3v18M14 3v18M5 9h5m-5 6h5m4-6h5m-5 6h5"/></svg></button>
      <button id="backView" class="icon-button" aria-label="背面视图" title="背面视图" disabled><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="1"/><path d="M10 3v18M14 3v18M7 6h1m-1 2h1m8-2h1m-1 2h1m-5 9h1m-1 2h1"/></svg></button>
      <button id="glassView" class="icon-button active" aria-label="切换玻璃透明显示" title="切换玻璃透明显示" aria-pressed="true" disabled><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
      <button id="frontVariantView" class="icon-button" aria-label="抽屉前板方案" title="抽屉前板方案" aria-expanded="false" aria-controls="frontVariantMenu" disabled hidden><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M3 9h18M10 7h4M12 9v10M5 16l5-5m4 5 5-5"/></svg></button>
      <button id="structureView" class="icon-button" aria-label="切换结构剖视" title="切换结构剖视" aria-pressed="false" disabled><svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5zM3 12l9 5 9-5M3 16l9 5 9-5"/></svg></button>
      <button id="dimensionsView" class="icon-button" aria-label="显示尺寸标注（cm）" title="显示尺寸标注（cm）" aria-pressed="false" disabled><svg viewBox="0 0 24 24"><path d="m3 16 13-13 5 5-13 13zM6 13l3 3m0-6 2 2m1-5 3 3m0-6 2 2"/></svg></button>
      <button id="wiringView" class="icon-button" aria-label="查看布线方案" title="查看布线方案" aria-pressed="false" disabled><svg viewBox="0 0 24 24"><rect x="3" y="3" width="6" height="5" rx="1"/><rect x="15" y="16" width="6" height="5" rx="1"/><path d="M6 8v9a2 2 0 0 0 2 2h7M9 5h7a2 2 0 0 1 2 2v9M12 3v4m-2 5h4"/></svg></button>
      <button id="allDoors" class="icon-button" aria-label="开关当前侧全部柜门" title="开关当前侧全部柜门" disabled><svg viewBox="0 0 24 24"><path d="M3 20V4h7v16M3 4l5 2v16l-5-2M14 20V4h7v16M14 4l5 2v16l-5-2M6 11v2m11-2v2"/></svg></button>
      <button id="singleView" class="icon-button" aria-label="单仓精细展示" title="单仓精细展示" aria-pressed="false" disabled><svg viewBox="0 0 24 24"><path d="m4 6 8-4 8 4v12l-8 4-8-4zM4 6l8 4 8-4M12 10v12M8 12v4m8-4v4"/></svg></button>
      <button id="demoToggle" class="icon-button" aria-label="播放借还演示" title="播放借还演示" aria-pressed="false" disabled><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m10 8 6 4-6 4z"/></svg></button>
      <button id="fullscreen" class="icon-button" aria-label="全屏展示" title="全屏展示"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button>
    </nav>
  </main>
  <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
  <script type="module" src="app.js?v=20261109-front-variants-v2"></script>
</body>
</html>
